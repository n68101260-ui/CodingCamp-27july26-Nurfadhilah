<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header & Greeting -->
        <header>
            <button id="theme-toggle">🌙 Dark Mode</button>
            <h1 id="time">00:00:00</h1>
            <p id="date">Loading date...</p>
            <h2 id="greeting">Hello, <span id="user-name" contenteditable="true">User</span>!</h2>
        </header>

        <div class="dashboard-grid">
            <!-- Focus Timer -->
            <section class="card timer-card">
                <h3>Focus Timer</h3>
                <div id="timer-display">25:00</div>
                <div class="timer-controls">
                    <button id="start-btn">Start</button>
                    <button id="stop-btn">Stop</button>
                    <button id="reset-btn">Reset</button>
                </div>
            </section>

            <!-- Quick Links -->
            <section class="card links-card">
                <h3>Quick Links</h3>
                <form id="link-form">
                    <input type="text" id="link-name" placeholder="Name (e.g. Google)" required>
                    <input type="url" id="link-url" placeholder="URL (https://...)" required>
                    <button type="submit">Add Link</button>
                </form>
                <div id="links-container" class="links-list"></div>
            </section>
        </div>

        <!-- To-Do List -->
        <section class="card todo-card">
            <h3>To-Do List</h3>
            <form id="todo-form">
                <input type="text" id="todo-input" placeholder="What needs to be done?" required>
                <button type="submit">Add Task</button>
            </form>
            <p id="error-msg" class="error-text"></p>
            <ul id="todo-list"></ul>
        </section>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
